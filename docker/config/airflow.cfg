###############################################################################
# Apache Airflow 3.2.1 configuration for the MWAA local-runner image.
#
# This file is intentionally focused: it only sets the options that matter for a
# local MWAA-like environment. Everything else falls back to the Airflow 3.2.1
# defaults. Several Airflow 2.x options/sections (e.g. [webserver], SLAs,
# SequentialExecutor, DAG pickling) were removed in Airflow 3 and are no longer
# present here. Runtime secrets (fernet key, api secret key, JWT secret) are
# injected as AIRFLOW__* environment variables by entrypoint.sh.
###############################################################################

[core]
# The folder where your airflow pipelines live. This path must be absolute.
dags_folder = /usr/local/airflow/dags

# Path to the folder containing Airflow plugins.
plugins_folder = /usr/local/airflow/plugins

# Default timezone in case supplied date times are naive (utc, system or any IANA tz).
default_timezone = utc

# The executor class that airflow should use. Airflow 3 removed the
# SequentialExecutor; LocalExecutor supports SQLite (WAL mode) for local use.
executor = LocalExecutor

# Airflow 3 defaults to the SimpleAuthManager. The local-runner keeps the FAB auth
# manager so the admin/test login and the `airflow users` CLI keep working.
auth_manager = airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager

# Maximum number of task instances that can run concurrently across all of Airflow.
parallelism = 150

# Maximum number of task instances allowed to run concurrently in each DAG.
max_active_tasks_per_dag = 150

# The maximum number of active DAG runs per DAG.
max_active_runs_per_dag = 16

# Are DAGs paused by default at creation.
dags_are_paused_at_creation = True

# Whether to load the example DAGs that ship with Airflow.
load_examples = False

# Secret key to save connection passwords in the db (overridden by
# AIRFLOW__CORE__FERNET_KEY at runtime).
fernet_key = $FERNET_KEY

# Whether to override params with dag_run.conf.
dag_run_conf_overrides_params = True

# How long before timing out a python file import.
dagbag_import_timeout = 30.0

# The number of retries each task is going to have by default.
default_task_retries = 0

# Task Slot counts for the default_pool.
default_pool_task_slot_count = 200

[database]
# SqlAlchemy pool settings for the metadata database. The connection string itself is
# provided at runtime via AIRFLOW__DATABASE__SQL_ALCHEMY_CONN (see entrypoint.sh).
sql_alchemy_pool_enabled = False
sql_alchemy_pool_size = 5
sql_alchemy_max_overflow = 10
sql_alchemy_pool_recycle = 1800
sql_alchemy_pool_pre_ping = True

# Whether to load the default connections that ship with Airflow.
load_default_connections = True

# Number of times the code should be retried in case of DB Operational Errors.
max_db_retries = 3

[logging]
# The folder where airflow should store its log files. This path must be absolute.
base_log_folder = /usr/local/airflow/logs

# Airflow can store logs remotely (S3, GCS, Elasticsearch). Disabled locally.
remote_logging = False

# Logging level. Supported values: CRITICAL, ERROR, WARNING, INFO, DEBUG.
logging_level = INFO

# Logging level for Flask-AppBuilder UI.
fab_logging_level = WARNING

# Colour the logs when the controlling terminal is a TTY.
colored_console_log = True

# Port on which the worker serves task logs to the api-server.
worker_log_server_port = 8793

[metrics]
# StatsD integration settings (mirrors the MWAA metrics setup).
statsd_on = True
statsd_host = localhost
statsd_port = 8125
statsd_prefix = airflow

[secrets]
# Full class name of secrets backend to enable. Empty = env vars + metastore only.
backend =

# Mirrors MWAA: only look up connections in the secrets backend that are not aws_default.
backend_kwargs = '{"connections_lookup_pattern":"^(?!aws_default$).*$"}'

[api]
# The api-server replaces the Airflow 2.x webserver and serves both the UI and REST API.
# The ip specified when starting the api server.
host = 0.0.0.0

# The port on which to run the api server.
port = 8080

# The base url of the api server / UI.
base_url = http://localhost:8080

# Secret key used to run the api server (overridden by AIRFLOW__API__SECRET_KEY at runtime).
secret_key = $SECRET_KEY

# Number of workers to run on the API server.
workers = 4

# Expose the configuration file in the api server.
expose_config = False

# Boolean for running SwaggerUI in the api server.
enable_swagger_ui = False

[api_auth]
# Algorithm used to sign the JWTs exchanged between Airflow components. The shared
# secret is injected via AIRFLOW__API_AUTH__JWT_SECRET at runtime (see entrypoint.sh).
jwt_algorithm = HS256

[fab]
# Update FAB permissions and sync security manager roles on api-server startup.
update_fab_perms = True

# Enable werkzeug ProxyFix middleware for reverse proxy.
enable_proxy_fix = True

# Session cookie settings for the FAB auth UI.
cookie_secure = False
cookie_samesite = Lax

[operators]
# The default owner assigned to each new operator.
default_owner = airflow

# Default queue that tasks get assigned to and that workers listen on.
default_queue = default

[scheduler]
# Airflow 3 runs the DAG processor as a standalone component (`airflow dag-processor`).
standalone_dag_processor = True

# Disable the mini scheduler after task execution for predictable single-machine behaviour.
schedule_after_task_execution = False

# Scheduler heartbeat / health settings.
scheduler_heartbeat_sec = 5

# If the last scheduler heartbeat happened more than this many seconds ago, the
# scheduler is considered unhealthy (used by the /health endpoint).
scheduler_health_check_threshold = 30

[dag_processor]
# How often (in seconds) to scan the DAGs directory for new files.
refresh_interval = 300

# Number of seconds after which a DAG file is re-parsed.
min_file_process_interval = 30

[triggerer]
# How many triggers a single Triggerer will run at once, by default.
default_capacity = 1000

[email]
# Email backend used for task email alerts.
email_backend = airflow.utils.email.send_email_smtp

[smtp]
# SMTP server used by airflow.utils.email.send_email_smtp.
smtp_host = localhost
smtp_starttls = True
smtp_ssl = False
smtp_port = 25
smtp_mail_from = airflow@example.com
smtp_timeout = 30
smtp_retry_limit = 5

[aws_mwaa]
# MWAA-specific values (ignored by core Airflow, kept for parity with MWAA).
redirect_url = https://console.aws.amazon.com/
session_duration_minutes = 720

[usage_data_collection]
# Disable Scarf usage data collection.
enabled = False
