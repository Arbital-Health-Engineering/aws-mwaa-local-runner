version: "3.7"
services:
  local-runner:
    image: amazon/mwaa-local:3_2_1
    restart: always
    environment:
      - LOAD_EX=n
      # Airflow 3 removed the SequentialExecutor; this maps to LocalExecutor on SQLite
      # (single container, no Postgres) in entrypoint.sh.
      - EXECUTOR=Sequential
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - "${PWD}/dags:/usr/local/airflow/dags"
      - "${PWD}/plugins:/usr/local/airflow/plugins"
      - "${PWD}/requirements:/usr/local/airflow/requirements"
    ports:
      - "8080:8080"
    command: local-runner
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/api/v2/monitor/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 3
